# The agent, as a Job that runs once. Set the two values marked CHANGE ME (see
# the README), then: kubectl apply -k .
apiVersion: v1
kind: ServiceAccount
metadata:
  name: example-agent
  namespace: k8s-agent-exchange
---
apiVersion: batch/v1
kind: Job
metadata:
  name: example-agent
  namespace: k8s-agent-exchange
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: example-agent
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: agent
          image: python:3.12-slim
          command: ["sh", "-c", "pip install -q --root-user-action=ignore --disable-pip-version-check -r /app/requirements.txt && python /app/agent.py"]
          env:
            - name: HUSH_GATEWAY_URL
              value: https://gateway.example.com/mcp # CHANGE ME
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: app
              mountPath: /app
            - name: hush-token
              mountPath: /var/run/secrets/hush
              readOnly: true
            - name: user-token
              mountPath: /var/run/secrets/user
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: example-agent
        - name: hush-token
          projected:
            sources:
              - serviceAccountToken:
                  # The gateway's issuer (see the README). CHANGE ME
                  audience: https://api.<region>.hush-security.com/v1/deployments/<deployment-id>/agents
                  expirationSeconds: 3600
                  path: token
        # A user's Hush token, to act for them. Optional: without it, the
        # agent acts as itself.
        - name: user-token
          secret:
            secretName: user-token
            optional: true
